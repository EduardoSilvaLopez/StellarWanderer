# Message dialogs. Edit freely: this file is read again every time a message opens.
#
# One section per message:
#   title  - the heading (optional)
#   text   - the body. Use triple quotes for several lines; a blank line starts a new paragraph.
#   button - the label of the button (optional, default "OK")
#   buttons - instead of button, a list of labels for several buttons, e.g. buttons = ["Yes", "No"].
#             The game code is told which one was pressed by its position in the list (first = 0).
#             Buttons share a row when they fit, otherwise they are stacked.
#
# {placeholders} are replaced with game data when the message is shown. Unknown ones stay as written.

[welcome]
title = "Welcome, {title} Pilot!"
text = """
Speaker Xi, the famous pilot trainer, has closed the communication with his last message. Now he will train other Citizen Pilots. You are ready.

{moon} extends in front of you. Your task is to plant mines in this ore-rich moon and bring it to the outpost in the planet, {planet}. The better you work, the more your reputation will increase.

The State of "Those-Who-Share" will provide you everything you need there, as they provided you this ship as long as you need it to perform your tasks for the Community.

You trained years for this. Now it is the time to decide what you do with your new freedom."""
button = "Understood"

[outpost_start_no_ore]
title = "Welcome, {title}."
text = """
I see you bring no ore, {title}.

We will maintain your ship and replenish your air, water and food storage, but please make your best to bring some ore.

Long live the Community."""
buttons = ["I understand, thank you for sharing", "Yeah, whatever"]

[outpost_start_ore]
title = "Welcome, {title}."
text = """
Thank you for the ore, {title}. It helps immensely.

We will maintain your ship and replenish your air, water and food storage.

Long live the Community."""
buttons = ["Long live", "Thank you for sharing", "Can you just pay me for the ore, and I buy what I need?"]

[outpost_ore_payment_requested]
title = "Welcome, {title}."
text = """

What is 'pay'...?

Wait... you mean... like in the Shining Throne? or UniDiv?

*LAUGHS*

How many stamps you think I'd have to...!?

You... can't be serious, yes?

Don't make such jokes, {title}.

Really.

Don't.

Long live the Community."""
button = "Long live. I guess."
